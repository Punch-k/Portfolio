    <script type="text/babel">
        const { useState } = React;
        
        // --- PASTE THE ENTIRE REACT CODE HERE ---
       
/* ============================ LOGPSim ============================
       A standalone logistics strategy simulation.
       Designed & built for the portfolio of Prapanch Kokkalemada.
       Engine: 12-week competitive supply chain vs. three rival firms.
    ================================================================== */

    // ---------- Core data ----------
    const DEMAND = {1:188,2:135,3:113,4:135,5:120,6:143,7:128,8:135,9:210,10:165,11:195,12:165,13:120,14:180,15:105,16:98,17:128,18:165,19:195,20:165,21:180,22:105,23:195,24:150,25:165,26:135,27:120,28:150,29:168,30:105,31:173,32:165,33:135,34:128,35:158,36:180};
    const SEASON = [0,1.0,0.95,0.9,0.85,0.9,1.0,1.05,1.1,1.15,1.1,1.0,1.0];
    const WEEKS = 12;
    const NAME = {sp:"Apex",wo:"Volt"}; // premium / value product lines
    const MATS = ["polymer","steel","rubber","aluminum"];
    const MAT_STD = {polymer:0.9,steel:0.5,rubber:2.35,aluminum:4.75};
    const BOM = {sp:{polymer:6,steel:8,rubber:6,aluminum:4,hrs:5,std:100,w:25,ref:400},
                 wo:{polymer:10,steel:12,rubber:0,aluminum:4,hrs:4,std:80,w:20,ref:200}};
    const SUPPLIERS = [
     {id:1,name:"Meridian Polymers",mat:"polymer",p1:1.05,brk:30000,p2:0.90},
     {id:2,name:"Cascade Polymers",mat:"polymer",p1:1.10,brk:20000,p2:0.95},
     {id:3,name:"Ironline Steel",mat:"steel",p1:0.60,brk:20000,p2:0.55},
     {id:4,name:"Foundry Steelworks",mat:"steel",p1:0.60,brk:50000,p2:0.50},
     {id:5,name:"Halcyon Rubber",mat:"rubber",p1:2.50,brk:12000,p2:2.35},
     {id:6,name:"Argent Aluminum",mat:"aluminum",p1:5.00,brk:12000,p2:4.75},
    ];
    const IN_FREIGHT = {
     1:{rail:[7.30,4.75],cheap:[6.40,5.30],rel:[7.10,6.50]},
     2:{rail:[6.90,3.00],cheap:[6.20,5.15],rel:[6.80,6.00]},
     3:{rail:[7.50,3.70],cheap:[6.30,5.90],rel:[7.00,6.40]},
     4:{rail:[7.10,4.40],cheap:[6.10,5.65],rel:[6.90,6.00]},
     5:{rail:[11.75,4.50],cheap:[9.20,7.50],rel:[11.35,9.80]},
     6:{rail:[13.05,5.25],cheap:[11.25,8.75],rel:[12.20,10.10]},
    };
    const IN_TRANSIT = {
     1:{rail:[1,2],cheap:[2,1],rel:[1,1]}, 2:{rail:[2,2],cheap:[1,1],rel:[1,1]},
     3:{rail:[2,3],cheap:[3,2],rel:[1,1]}, 4:{rail:[1,3],cheap:[2,2],rel:[1,1]},
     5:{rail:[2,4],cheap:[2,1],rel:[1,1]}, 6:{rail:[2,4],cheap:[2,2],rel:[1,1]},
    };
    const IN_REL = {rail:[.94,.03,.03,0],cheap:[.88,.06,.05,.01],rel:[.96,.02,.02,0]};
    const FG_FREIGHT = {
     cheap:{L:[4.80,5.20,6.32,6.64,7.20,7.52],T:[3.00,3.56,3.88,4.04,4.48,4.64]},
     rel:{L:[5.20,5.68,6.52,7.12,7.65,8.00],T:[3.20,3.68,4.08,4.56,4.88,5.52]},
     prem:{L:[7.12,7.36,8.40,9.16,9.60,10.48],T:[6.40,7.20,8.00,8.60,8.96,9.68]},
    };
    const FG_REL = {cheap:[.88,.06,.05,.01],rel:[.96,.02,.02,0],prem:[.99,.01,0,0]};
    const CUST_RATE = [4,13,21,27,33,36,39];
    const UTIL_PTS = [[0,300000],[50,75000],[75,18750],[90,3000],[100,0],[115,6750],[120,12000]];

    const COORDS = (()=>{const c={};let m=1;
     [[6,200],[12,400],[18,600]].forEach(([n,r],ri)=>{for(let i=0;i<n;i++){
       const a=(2*Math.PI*i)/n + ri*0.26; c[m]={x:r*Math.cos(a),y:r*Math.sin(a),ring:ri+1}; m++;}});
     c[37]={x:0,y:0,ring:0}; return c;})();
    const dist=(a,b)=>Math.hypot(COORDS[a].x-COORDS[b].x,COORDS[a].y-COORDS[b].y);
    const bucket=(mi)=>Math.min(5,Math.max(0,Math.ceil(mi/200)-1));
    const custRate=(mi)=>mi<=50?CUST_RATE[0]:CUST_RATE[Math.min(6,Math.ceil(mi/200))];
    const REGION_OF=(m)=>COORDS[m].ring;

    const fmt=(n)=>Math.round(n).toLocaleString();
    const money=(n)=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString();
    let seed=42; const rnd=()=>{seed=(seed*1103515245+12345)%2147483648; return seed/2147483648;};
    const delayPick=(p)=>{const r=rnd();let a=0;for(let i=0;i<4;i++){a+=p[i];if(r<=a)return i;}return 0;};
    const utilCharge=(pct)=>{if(pct<=0)return UTIL_PTS[0][1];
     for(let i=1;i<UTIL_PTS.length;i++){const[a,ca]=UTIL_PTS[i-1],[b,cb]=UTIL_PTS[i];
      if(pct<=b)return ca+(cb-ca)*(pct-a)/(b-a);}
     return 12000+(pct-120)*900;};
    const truckSplit=(lbs)=>{let tl=Math.floor(lbs/11000),rem=lbs-tl*11000;if(rem>=9000){tl++;rem=0;}return{tl,rem};};
    const inFreightCost=(sup,mode,lbs)=>{const[l,t]=IN_FREIGHT[sup][mode];const{tl,rem}=truckSplit(lbs);return(tl*11000*t+rem*l)/100+50;};
    const fgFreightCost=(mode,mi,lbs)=>{const b=bucket(Math.max(200,mi));const T=FG_FREIGHT[mode].T[b],L=FG_FREIGHT[mode].L[b];const{tl,rem}=truckSplit(lbs);return(tl*11000*T+rem*L)/100+50;};

    const initGame=(dcs)=>({
     phase:"play",week:1,capacity:10000,capPending:[],
     mat:{polymer:14000,steel:12000,rubber:5500,aluminum:10000},
     matOpen:[
      {mat:"polymer",qty:15000,arrive:1},{mat:"steel",qty:10000,arrive:1},{mat:"rubber",qty:6000,arrive:1},{mat:"aluminum",qty:10000,arrive:1},
      {mat:"polymer",qty:10000,arrive:2},{mat:"steel",qty:10000,arrive:2},{mat:"rubber",qty:6000,arrive:2},{mat:"aluminum",qty:10000,arrive:2},
      {mat:"steel",qty:10000,arrive:3},{mat:"rubber",qty:6000,arrive:3},{mat:"aluminum",qty:10000,arrive:3},
      {mat:"rubber",qty:7500,arrive:4},{mat:"aluminum",qty:10000,arrive:4},{mat:"aluminum",qty:10000,arrive:5}],
     plant:{sp:dcs.plantSp,wo:dcs.plantWo},
     schedule:{1:{sp:900,wo:900},2:{sp:900,wo:900}},
     dcs:dcs.list.map(d=>({...d,inbound:[]})),
     svc:{1:0.95,2:0.95,3:0.95},
     share:{},
     ai:[{name:"Northbridge Ltd."},{name:"Vector Freight Co."},{name:"Atlas Consumer"}].map(a=>({...a,svc:0.95,ytdVar:0,ytdShare:0.25})),
     ytd:{variance:0,revenue:0,sold:0,industry:0},
     history:[],
    });

    function advanceWeek(g,d){
     const w=g.week, S=SEASON[w];
     const E={expedite:0,orderPlace:0,ppv:0,inbound:0,matCarry:0,matFixed:900,matHandle:0,matDemur:0,
              orderProc:0,fgCarry:0,custFreight:0,fgFixedPlant:2500,fgFixedDC:0,fgHandle:0,fgDemur:0,capChg:0,util:0};
     const ng=JSON.parse(JSON.stringify(g));

     ng.capPending=ng.capPending.filter(c=>{if(c.week<=w){ng.capacity=Math.min(14000,ng.capacity+c.hrs);return false;}return true;});
     if(d.capChange){const hrs=Math.max(-5000,Math.min(14000-ng.capacity,d.capChange));
       if(hrs!==0){E.capChg+=Math.abs(hrs)*50;ng.capPending.push({week:w+2,hrs});}}

     ng.matOpen=ng.matOpen.filter(o=>{if(o.arrive<=w){ng.mat[o.mat]+=o.qty;return false;}return true;});

     d.orders.slice(0,6).forEach(o=>{
      if(!o.qty||o.qty<=0)return;
      const sup=SUPPLIERS.find(s=>s.id===o.sup); if(!sup)return;
      const unit=o.qty>=sup.brk?sup.p2:sup.p1;
      E.orderPlace+=50;
      E.ppv+=(unit-MAT_STD[sup.mat])*o.qty;
      E.inbound+=inFreightCost(sup.id,o.mode,o.qty);
      const tt=IN_TRANSIT[sup.id][o.mode][o.qty>=9000?1:0];
      ng.matOpen.push({mat:sup.mat,qty:o.qty,arrive:w+tt+delayPick(IN_REL[o.mode])});
     });

     const addSched=(wk,sp,wo)=>{if(!ng.schedule[wk])ng.schedule[wk]={sp:0,wo:0};
       ng.schedule[wk].sp=Math.max(0,ng.schedule[wk].sp+sp);ng.schedule[wk].wo=Math.max(0,ng.schedule[wk].wo+wo);};
     addSched(w+2,d.reg.sp,d.reg.wo);
     if(d.exp.sp||d.exp.wo){addSched(w+1,d.exp.sp,d.exp.wo);E.expedite+=2*(Math.abs(d.exp.sp)+Math.abs(d.exp.wo));}
     if(d.rush.sp||d.rush.wo){addSched(w,d.rush.sp,d.rush.wo);E.expedite+=3.5*(Math.abs(d.rush.sp)+Math.abs(d.rush.wo));}
     let plan={...(ng.schedule[w]||{sp:0,wo:0})};
     const maxHrs=ng.capacity*1.2;
     let hrs=plan.sp*5+plan.wo*4;
     if(hrs>maxHrs){const k=maxHrs/hrs;plan.sp=Math.floor(plan.sp*k);plan.wo=Math.floor(plan.wo*k);}
     let scale=1;
     MATS.forEach(m=>{const need=plan.sp*BOM.sp[m]+plan.wo*BOM.wo[m];
       if(need>0&&need>ng.mat[m])scale=Math.min(scale,ng.mat[m]/need);});
     if(scale<1){const cutS=plan.sp-Math.floor(plan.sp*scale),cutW=plan.wo-Math.floor(plan.wo*scale);
       plan.sp-=cutS;plan.wo-=cutW;E.expedite+=3.5*(cutS+cutW);}
     let matUsed=0;
     MATS.forEach(m=>{const use=plan.sp*BOM.sp[m]+plan.wo*BOM.wo[m];ng.mat[m]-=use;matUsed+=use;});
     E.matHandle+=matUsed*0.06;
     ng.plant.sp+=plan.sp; ng.plant.wo+=plan.wo;
     hrs=plan.sp*5+plan.wo*4;
     E.util+=utilCharge(100*hrs/ng.capacity);
     const stdProd=plan.sp*100+plan.wo*80;

     d.ships.slice(0,6).forEach(s=>{
      const dc=ng.dcs[s.dc]; if(!dc)return;
      const sp=Math.min(s.sp||0,ng.plant.sp), wo=Math.min(s.wo||0,ng.plant.wo);
      if(sp+wo<=0)return;
      ng.plant.sp-=sp; ng.plant.wo-=wo;
      const lbs=sp*25+wo*20;
      E.orderProc+=fgFreightCost(s.mode,dist(37,dc.market),lbs);
      E.fgHandle+=(sp+wo)*1.5;
      const delay=delayPick(FG_REL[s.mode]);
      if(s.mode==="prem"&&delay===0){dc.sp+=sp;dc.wo+=wo;}
      else dc.inbound.push({arrive:w+Math.max(1,(s.mode==="prem"?0:1)+delay),sp,wo});
     });

     ng.dcs.forEach(dc=>{dc.inbound=dc.inbound.filter(sh=>{if(sh.arrive<=w){dc.sp+=sh.sp;dc.wo+=sh.wo;return false;}return true;});});

     const aiPrices={};
     ng.ai.forEach((a,i)=>{aiPrices[i]={sp:Math.round(400*(0.93+rnd()*0.14)),wo:Math.round(200*(0.93+rnd()*0.14))};});
     let revenue=0, sold=0, industry=0;
     const regionSales={1:{sp:0,wo:0},2:{sp:0,wo:0},3:{sp:0,wo:0}};
     const marketsServed=new Set();
     const assign={};
     Object.keys(DEMAND).forEach(m=>{let best=-1,bd=1e9;
       ng.dcs.forEach((dc,i)=>{const dd=dist(+m,dc.market);if(dd<bd){bd=dd;best=i;}});assign[m]=best;});
     const dcMarkets=ng.dcs.map((dc,i)=>Object.keys(DEMAND).filter(m=>assign[m]===i)
       .sort((a,b)=>dist(+a,dc.market)-dist(+b,dc.market)));
     ["sp","wo"].forEach(P=>{
      const elast=P==="sp"?2.2:4.0, ref=BOM[P].ref;
      [1,2,3].forEach(r=>{
       const myP=Math.max(50,Math.min(999,d.prices[r][P]||ref));
       const promo=w>=3?(d.promo[r]||0):0;
       const all=[myP,...ng.ai.map((a,i)=>aiPrices[i][P])];
       const indAvg=all.reduce((a,b)=>a+b,0)/4;
       const indFactor=Math.max(0.6,Math.min(1.6,Math.pow(ref/indAvg,0.7)));
       const promoBoost=1+0.18*Math.sqrt(promo/12000);
       const key=r+P; const prior=ng.share[key]??0.25;
       const scores=[Math.pow(ref/myP,elast)*promoBoost*ng.svc[r],
         ...ng.ai.map((a,i)=>Math.pow(ref/aiPrices[i][P],elast)*1.05*a.svc)];
       const tot=scores.reduce((a,b)=>a+b,0);
       let myShare=0.4*prior+0.6*(scores[0]/tot);
       let demandR=0,soldR=0;
       Object.keys(DEMAND).forEach(m=>{if(REGION_OF(+m)!==r)return;
         demandR+=Math.round(DEMAND[m]*S*indFactor);});
       industry+=demandR;
       ng.dcs.forEach((dc,i)=>{
        dcMarkets[i].forEach(m=>{if(REGION_OF(+m)!==r)return;
         const md=Math.round(DEMAND[m]*S*indFactor);
         const want=Math.round(md*myShare);
         const got=Math.min(want,dc[P]);
         if(got>0){dc[P]-=got;soldR+=got;revenue+=got*myP;
           E.custFreight+=got*BOM[P].w/100*custRate(dist(+m,dc.market));
           marketsServed.add(m);
           E.fgHandle+=got*1.5;}
        });});
       sold+=soldR; regionSales[r][P]+=soldR;
       const fill=demandR>0?soldR/Math.max(1,Math.round(demandR*myShare)):1;
       ng.svc[r]=Math.max(0.6,Math.min(1.05,0.85*ng.svc[r]+0.15*(0.9+0.15*Math.min(1,fill))));
       ng.share[key]=demandR>0?Math.max(0.02,soldR/demandR):prior;
      });
     });
     E.custFreight+=marketsServed.size*50;
     ng.ai.forEach(a=>{a.svc=Math.max(0.85,Math.min(1.02,a.svc+(rnd()-0.5)*0.04));});

     const matVal=MATS.reduce((a,m)=>a+ng.mat[m]*MAT_STD[m],0);
     E.matCarry=matVal*0.20/52;
     const matTot=MATS.reduce((a,m)=>a+ng.mat[m],0);
     if(matTot>45000)E.matDemur=(matTot-45000)*0.16;
     let fgVal=ng.plant.sp*100+ng.plant.wo*80;
     ng.dcs.forEach(dc=>{fgVal+=dc.sp*100+dc.wo*80+dc.inbound.reduce((a,s)=>a+s.sp*100+s.wo*80,0);
       E.fgFixedDC+=dc.cap*0.5;
       const over=dc.sp+dc.wo-dc.cap; if(over>0)E.fgDemur+=over*6.4;});
     const plantOver=ng.plant.sp+ng.plant.wo-5000; if(plantOver>0)E.fgDemur+=plantOver*6.4;
     E.fgCarry=fgVal*0.30/52;

     const promoTotal=w>=3?[1,2,3].reduce((a,r)=>a+(d.promo[r]||0),0):0;
     const grossProfit=revenue-stdProd-E.capChg-promoTotal;
     const budget=0.4*grossProfit;
     const logistics=Object.keys(E).reduce((a,k)=>k==="capChg"?a:a+E[k],0);
     const variance=budget-logistics;
     const wkShare=industry>0?sold/industry:0;
     ng.ytd.variance+=variance; ng.ytd.revenue+=revenue; ng.ytd.sold+=sold; ng.ytd.industry+=industry;
     ng.ai.forEach((a)=>{const aShare=(1-wkShare)/3*(0.9+rnd()*0.2);
       a.ytdShare=(a.ytdShare*(w-1)+aShare)/w;
       a.ytdVar+=revenue*(0.35+rnd()*0.25)*(0.08+rnd()*0.06);});
     ng.history.push({week:w,revenue,stdProd,promoTotal,grossProfit,budget,expenses:E,logistics,variance,
       sold,industry,share:wkShare,produced:plan,regionSales});
     ng.week=w+1;
     if(ng.week>WEEKS)ng.phase="end";
     return ng;
    }

    // ---------- Design tokens: editorial-brutalist, matched to punch-k.github.io ----------
    const T={ink:"#141414",paper:"#F3F2EE",panel:"#FFFFFF",line:"#D8D6CF",dim:"#6E6C66",
     accent:"#FF4D00",good:"#1D7A46",bad:"#C2281B",
     mono:"ui-monospace,SFMono-Regular,Menlo,Consolas,monospace",
     serif:"Georgia,'Times New Roman',serif",
     sans:"'Helvetica Neue',Helvetica,Arial,sans-serif"};

    const Sty={
     wrap:{minHeight:"100vh",background:T.paper,color:T.ink,fontFamily:T.sans,fontSize:14,display:"flex",flexDirection:"column"},
     head:{padding:"22px 28px 14px",borderBottom:`1px solid ${T.ink}`,display:"flex",alignItems:"flex-end",gap:20,flexWrap:"wrap"},
     brand:{margin:0,fontSize:34,fontWeight:800,letterSpacing:"-0.02em",lineHeight:1},

    // ---------- Bokeh instruction overlay (signature element) ----------
    function BokehOverlay({onClose}){
     const dots=[["18%","12%",190,"#FF4D00",0.20,"14s"],["70%","8%",260,"#1D7A46",0.14,"18s"],
      ["8%","62%",230,"#FF4D00",0.12,"16s"],["62%","58%",300,"#2E5BFF",0.10,"20s"],["40%","30%",160,"#FFB800",0.16,"12s"]];
     return(<div onClick={onClose} style={{position:"fixed",inset:0,zIndex:50,
       background:"rgba(20,20,20,0.55)",backdropFilter:"blur(10px)",WebkitBackdropFilter:"blur(10px)",
       display:"flex",alignItems:"center",justifyContent:"center",padding:20,overflow:"hidden"}}>
      <style>{`@keyframes lgFloat{0%{transform:translate(0,0)}50%{transform:translate(26px,-34px)}100%{transform:translate(0,0)}}
        @media (prefers-reduced-motion: reduce){.lg-bokeh{animation:none !important}}`}</style>
      {dots.map(([l,t,s,c,o,dur],i)=>(<div key={i} className="lg-bokeh" style={{position:"absolute",left:l,top:t,width:s,height:s,
        borderRadius:"50%",background:c,opacity:o,filter:"blur(46px)",animation:`lgFloat ${dur} ease-in-out infinite`,pointerEvents:"none"}}/>))}
      <div onClick={e=>e.stopPropagation()} style={{position:"relative",maxWidth:760,maxHeight:"84vh",overflowY:"auto",
        background:"rgba(255,255,254,0.94)",border:`1px solid ${T.ink}`,padding:"28px 32px",boxShadow:"0 30px 80px rgba(0,0,0,0.35)"}}>
       <div style={Sty.eyebrow}>OPERATOR'S BRIEF — LOGPSIM v1.0</div>
       <h2 style={{...Sty.h2,fontSize:28,margin:"6px 0 14px"}}>How the game <span style={Sty.h2i}>works.</span></h2>
       <p><strong>Objective.</strong> Run a two-product manufacturer for 12 weeks against three rival firms. Your score is the <em>performance index</em>: year-to-date market share × year-to-date logistics variance (your logistics budget — 40% of gross profit — minus every logistics dollar you spend).</p>
       <p><strong>The loop, each week.</strong> Set prices and promotion by region → order materials from six suppliers (quantity breaks, three transport modes, stochastic transit reliability) → schedule production (regular runs land in two weeks; expediting and rush runs cost premiums; plant utilization far from 100% is penalized) → ship finished goods to your DCs (premium freight arrives overnight and is sellable the same week) → the market clears, and stockouts bleed share to rivals.</p>
       <p><strong>Products.</strong> {NAME.sp} is the premium line ($400 reference, moderately price-sensitive). {NAME.wo} is the value line ($200 reference, highly price-sensitive). Both consume shared materials and plant hours — the mix is a real trade-off.</p>
       <p><strong>Cost physics to respect.</strong> Materials carry at 20%/yr and finished goods at 30%/yr (including in transit); warehouses charge fixed, handling, and demurrage fees; every order and shipment carries a $50 documentation charge; an idle plant costs up to $300K a week. Just-in-time flow with reliable carriers is usually the winning posture — premium freight only when a stockout threatens.</p>
       <p><strong>Design phase.</strong> Before week 1 you place up to three distribution centers, size them, and split 2,000 units of each product across the network. Locations are permanent. Choose against the demand map, not by symmetry.</p>
       <div style={{marginTop:18}}><button style={Sty.btnA} onClick={onClose}>Close brief → run operations</button></div>
      </div>
     </div>);
    }

    function Setup({onStart}){
     const [dcs,setDcs]=useState([{market:19,cap:1500},{market:23,cap:2000},{market:28,cap:1500}]);
     const [alloc,setAlloc]=useState([{sp:666,wo:666},{sp:668,wo:668},{sp:666,wo:666}]);
     const [plantAlloc,setPlantAlloc]=useState({sp:0,wo:0});
     const [picking,setPicking]=useState(null);
     const totSp=plantAlloc.sp+alloc.reduce((a,x)=>a+(x?.sp||0),0);
     const totWo=plantAlloc.wo+alloc.reduce((a,x)=>a+(x?.wo||0),0);
     const active=dcs.filter(Boolean);
     const valid=active.length>=1&&totSp===2000&&totWo===2000&&
       active.every((d,i)=>(alloc[i]?.sp||0)+(alloc[i]?.wo||0)<=d.cap)&&
       new Set(active.map(d=>d.market)).size===active.length;
     return(<div style={Sty.panel}>

      <h2 style={Sty.h2}>Design the network. <span style={Sty.h2i}>Then live with it.</span></h2>
      <p style={{maxWidth:720,color:T.dim}}>Place up to three distribution centers, size their capacity, and allocate 2,000 {NAME.sp}s and 2,000 {NAME.wo}s across the plant warehouse and DCs. Locations lock for all 12 weeks — markets auto-assign to their nearest DC, and pricing regions follow the three demand rings.</p>
      <div style={{display:"flex",gap:28,flexWrap:"wrap"}}>
       <div><div style={Sty.lbl}>Demand map — click to place the selected DC</div>
        <MapView dcs={active} pick={picking!=null?dcs[picking]?.market:null}
          onPick={(m)=>{if(picking==null)return;const nd=[...dcs];nd[picking]={...(nd[picking]||{cap:1500}),market:m};setDcs(nd);}}/>
       </div>
       <div style={{flex:1,minWidth:320}}>
        <table style={{borderCollapse:"collapse",width:"100%"}}>
         <thead><tr><th style={Sty.thL}>Facility</th><th style={Sty.th}>Market</th><th style={Sty.th}>Capacity</th><th style={Sty.th}>{NAME.sp}</th><th style={Sty.th}>{NAME.wo}</th><th style={Sty.th}></th></tr></thead>
         <tbody>
          <tr><td style={Sty.tdL}>Plant warehouse (HQ)</td><td style={Sty.td}>—</td><td style={Sty.td}>5,000</td>
           <td style={Sty.td}><input style={Sty.inp} type="number" value={plantAlloc.sp} onChange={e=>setPlantAlloc({...plantAlloc,sp:+e.target.value||0})}/></td>
           <td style={Sty.td}><input style={Sty.inp} type="number" value={plantAlloc.wo} onChange={e=>setPlantAlloc({...plantAlloc,wo:+e.target.value||0})}/></td><td style={Sty.td}/></tr>

           <td style={Sty.tdL}>DC {String(i+1).padStart(2,"0")} {dcs[i]&&<button style={{...Sty.btn2,marginLeft:6,padding:"2px 8px"}} onClick={()=>setPicking(i)}>{picking===i?"click map…":"move"}</button>}</td>
           <td style={Sty.td}>{dcs[i]?dcs[i].market:<button style={Sty.btn2} onClick={()=>{const nd=[...dcs];nd[i]={market:1,cap:1500};setDcs(nd);setPicking(i);}}>add</button>}</td>
           <td style={Sty.td}>{dcs[i]&&<input style={Sty.inp} type="number" value={dcs[i].cap} onChange={e=>{const nd=[...dcs];nd[i]={...nd[i],cap:+e.target.value||0};setDcs(nd);}}/>}</td>
           <td style={Sty.td}>{dcs[i]&&<input style={Sty.inp} type="number" value={alloc[i]?.sp||0} onChange={e=>{const na=[...alloc];na[i]={...na[i],sp:+e.target.value||0};setAlloc(na);}}/>}</td>

        <button style={{...Sty.btnA,opacity:valid?1:0.35}} disabled={!valid}

    function Statement({h}){
     const E=h.expenses;
     const L=(label,val,indent=0)=>`${" ".repeat(indent)}${label.padEnd(38-indent,".")}${String(money(val)).padStart(13)}\n`;
     let s="";
     s+="            L O G P S I M   O P E R A T I O N S   L E D G E R\n";
     s+=`                     FINANCIAL STATEMENT — WEEK ${String(h.week).padStart(2,"0")}\n\n`;
     s+=L("COMPANY REVENUE",h.revenue);
     s+=L("Standard production",-h.stdProd,2);
     s+=L("Promotion & marketing",-h.promoTotal,2);
     s+=L("Capacity change charges",-E.capChg,2);
     s+=L("GROSS PROFIT",h.grossProfit);
     s+="—".repeat(53)+"\n";
     s+=L("LOGISTICS BUDGET (40% of GP)",h.budget);
     s+=L("Expediting / utilization",E.expedite+E.util,2);
     s+=L("Order placement",E.orderPlace,2);
     s+=L("Purchase price variance",E.ppv,2);
     s+=L("Inbound transportation",E.inbound,2);
     s+=L("Material carrying (20%/yr)",E.matCarry,2);
     s+=L("Material whse fixed + handling",E.matFixed+E.matHandle,2);
     s+=L("Material demurrage",E.matDemur,2);
     s+=L("Outbound shipping (plant→DC)",E.orderProc,2);
     s+=L("Customer freight",E.custFreight,2);
     s+=L("FG carrying (30%/yr)",E.fgCarry,2);
     s+=L("FG whse fixed (plant+DC)",E.fgFixedPlant+E.fgFixedDC,2);
     s+=L("FG handling",E.fgHandle,2);
     s+=L("FG demurrage & detention",E.fgDemur,2);
     s+=L("TOTAL LOGISTICS EXPENSES",h.logistics);
     s+="—".repeat(53)+"\n";
     s+=L("LOGISTICS VARIANCE",h.variance);
     return <div style={Sty.report}>{s}</div>;
    }

         <table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead><tr><th style={Sty.thL}>Material</th><th style={Sty.th}>On hand</th><th style={Sty.th}>Wk {w}</th><th style={Sty.th}>Wk {w+1}</th><th style={Sty.th}>Later</th></tr></thead>
          <tbody>{MATS.map(m=>{const due=(k)=>game.matOpen.filter(o=>o.mat===m&&(k==="later"?o.arrive>=w+2:o.arrive===k)).reduce((a,o)=>a+o.qty,0);
           return(<tr key={m}><td style={Sty.tdL}>{m}</td><td style={Sty.td}>{fmt(game.mat[m])}</td>
            <td style={Sty.td}>{fmt(due(w))}</td><td style={Sty.td}>{fmt(due(w+1))}</td><td style={Sty.td}>{fmt(due("later"))}</td></tr>);})}
          </tbody></table>
         <div style={{...Sty.lbl,marginTop:16}}>Production schedule</div>
         <div style={{fontFamily:T.mono,fontSize:13}}>
          {[w,w+1,w+2].map(k=>{const s=game.schedule[k]||{sp:0,wo:0};return `Wk ${k}: ${s.sp} ${NAME.sp} / ${s.wo} ${NAME.wo}   `;})}
         </div>
        </div>
       </div>
      </div>}

      {tab==="mkt"&&<div style={Sty.panel}>
       <h2 style={Sty.h2}>Marketing. <span style={Sty.h2i}>Price is a demand lever.</span></h2>
       <p style={{fontSize:13,color:T.dim,maxWidth:680}}>{NAME.wo} is highly price-sensitive; {NAME.sp} moderately. Promotion unlocks in week 3 and shows diminishing returns (~10% of gross sales is the industry norm). Price bounds $50–$999.</p>
       <table style={{borderCollapse:"collapse"}}>
        <thead><tr><th style={Sty.thL}>Region</th><th style={Sty.th}>{NAME.sp} $</th><th style={Sty.th}>{NAME.wo} $</th><th style={Sty.th}>Promotion $</th><th style={Sty.th}>Last wk sold</th></tr></thead>
        <tbody>{[1,2,3].map(r=>(<tr key={r}>
         <td style={Sty.tdL}>R{r} — {r===1?"inner":r===2?"middle":"outer"} ring</td>
         <td style={Sty.td}>{num(dec.prices[r].sp,v=>setDec({...dec,prices:{...dec.prices,[r]:{...dec.prices[r],sp:v}}}))}</td>
         <td style={Sty.td}>{num(dec.prices[r].wo,v=>setDec({...dec,prices:{...dec.prices,[r]:{...dec.prices[r],wo:v}}}))}</td>
         <td style={Sty.td}>{w>=3?num(dec.promo[r],v=>setDec({...dec,promo:{...dec.promo,[r]:v}})):<span style={{opacity:0.4,fontFamily:T.mono,fontSize:12}}>WK 3+</span>}</td>
         <td style={Sty.td}>{last?`${fmt(last.regionSales[r].sp)} / ${fmt(last.regionSales[r].wo)}`:"—"}</td>
        </tr>))}</tbody></table>
      </div>}

      {tab==="proc"&&<div style={Sty.panel}>
       <h2 style={Sty.h2}>Procurement. <span style={Sty.h2i}>Buy the break, not the pile.</span></h2>
       <p style={{fontSize:13,color:T.dim}}>Up to 6 orders/week · $50 placement each · paying above standard cost books purchase-price variance · 20%/yr carrying on week-end inventory.</p>
       <table style={{borderCollapse:"collapse",width:"100%"}}>
        <thead><tr><th style={Sty.thL}>#</th><th style={Sty.thL}>Supplier</th><th style={Sty.th}>Unit / break / unit</th><th style={Sty.thL}>Mode</th><th style={Sty.th}>Qty</th><th style={Sty.th}>Transit</th></tr></thead>
        <tbody>{dec.orders.map((o,i)=>{const sup=SUPPLIERS.find(s=>s.id===o.sup);
         const tt=IN_TRANSIT[o.sup][o.mode][(o.qty||0)>=9000?1:0];
         return(<tr key={i}><td style={Sty.td}>{String(i+1).padStart(2,"0")}</td>
          <td style={Sty.tdL}><select style={Sty.sel} value={o.sup} onChange={e=>{const no=[...dec.orders];no[i]={...o,sup:+e.target.value};setDec({...dec,orders:no});}}>
           {SUPPLIERS.map(s=><option key={s.id} value={s.id}>{s.name} — {s.mat}</option>)}</select></td>
          <td style={Sty.td}>${sup.p1.toFixed(2)} / {fmt(sup.brk)} / ${sup.p2.toFixed(2)}</td>
          <td style={Sty.tdL}><select style={Sty.sel} value={o.mode} onChange={e=>{const no=[...dec.orders];no[i]={...o,mode:e.target.value};setDec({...dec,orders:no});}}>
           <option value="rail">Rail</option><option value="cheap">Economy truck</option><option value="rel">Reliable truck</option></select></td>
          <td style={Sty.td}>{num(o.qty,v=>{const no=[...dec.orders];no[i]={...o,qty:v};setDec({...dec,orders:no});})}</td>
          <td style={Sty.td}>{o.qty>0?`${tt} wk`:"—"}</td></tr>);})}
        </tbody></table>
       <p style={{fontFamily:T.mono,fontSize:12,color:T.dim}}>STD COSTS — polymer $0.90 · steel $0.50 · rubber $2.35 · aluminum $4.75</p>
      </div>}

      {tab==="prod"&&<div style={Sty.panel}>
       <h2 style={Sty.h2}>Production. <span style={Sty.h2i}>Idle plants bill you.</span></h2>
       <p style={{fontSize:13,color:T.dim,maxWidth:720}}>Regular orders run in week {w+2}. Expedited (+$2/u) run week {w+1}; rush (+$3.50/u) run this week. {NAME.sp} = 5 hrs, {NAME.wo} = 4 hrs. Capacity {fmt(game.capacity)} hrs, max output 120% ({fmt(game.capacity*1.2)} hrs). Utilization away from 100% is charged — a dark plant costs up to $300K.</p>
       <table style={{borderCollapse:"collapse"}}>
        <thead><tr><th style={Sty.thL}>Order type</th><th style={Sty.th}>Runs in</th><th style={Sty.th}>Δ {NAME.sp}</th><th style={Sty.th}>Δ {NAME.wo}</th></tr></thead>
        <tbody>
         {[["Regular","reg",w+2],["Expedited","exp",w+1],["Rush","rush",w]].map(([l,k,wk])=>(<tr key={k}>
          <td style={Sty.tdL}>{l}</td><td style={Sty.td}>wk {wk}</td>
          <td style={Sty.td}>{num(dec[k].sp,v=>setDec({...dec,[k]:{...dec[k],sp:v}}))}</td>
          <td style={Sty.td}>{num(dec[k].wo,v=>setDec({...dec,[k]:{...dec[k],wo:v}}))}</td></tr>))}
        </tbody></table>
       <div style={{marginTop:14}}>
        <span style={Sty.lbl}>Capacity change — net hrs · $50/hr · 2-wk lead · 14,000 max: </span>
        {num(dec.capChange,v=>setDec({...dec,capChange:v}))}
       </div>
       <div style={{fontFamily:T.mono,fontSize:13,marginTop:12}}>
        WK {w} PLAN: {(game.schedule[w]?.sp||0)+dec.rush.sp} {NAME.sp} / {(game.schedule[w]?.wo||0)+dec.rush.wo} {NAME.wo}
        = {((game.schedule[w]?.sp||0)+dec.rush.sp)*5+((game.schedule[w]?.wo||0)+dec.rush.wo)*4} hrs
       </div>
      </div>}

      {tab==="ship"&&<div style={Sty.panel}>
       <h2 style={Sty.h2}>Distribution. <span style={Sty.h2i}>Freight is a service decision.</span></h2>
       <p style={{fontSize:13,color:T.dim,maxWidth:720}}>Up to 6 plant→DC shipments ($50 + freight each). Economy/Reliable arrive next week with reliability risk; Premium arrives overnight — sellable this week. FG carrying (30%/yr) applies in transit. {NAME.sp} 25 lb, {NAME.wo} 20 lb; full trucks (9–11k lb) ride TL rates.</p>
       <table style={{borderCollapse:"collapse"}}>
        <thead><tr><th style={Sty.thL}>#</th><th style={Sty.thL}>Destination</th><th style={Sty.thL}>Mode</th><th style={Sty.th}>{NAME.sp}</th><th style={Sty.th}>{NAME.wo}</th><th style={Sty.th}>Est. cost</th></tr></thead>
        <tbody>{dec.ships.map((s,i)=>{const dc=game.dcs[s.dc];const lbs=(s.sp||0)*25+(s.wo||0)*20;
         const est=lbs>0?fgFreightCost(s.mode,dist(37,dc.market),lbs):0;
         return(<tr key={i}><td style={Sty.td}>{String(i+1).padStart(2,"0")}</td>
          <td style={Sty.tdL}><select style={Sty.sel} value={s.dc} onChange={e=>{const ns=[...dec.ships];ns[i]={...s,dc:+e.target.value};setDec({...dec,ships:ns});}}>
           {game.dcs.map((d,j)=><option key={j} value={j}>DC {String(j+1).padStart(2,"0")} — mkt {d.market}</option>)}</select></td>
          <td style={Sty.tdL}><select style={Sty.sel} value={s.mode} onChange={e=>{const ns=[...dec.ships];ns[i]={...s,mode:e.target.value};setDec({...dec,ships:ns});}}>
           <option value="cheap">Economy</option><option value="rel">Reliable</option><option value="prem">Premium — o/n</option></select></td>
          <td style={Sty.td}>{num(s.sp,v=>{const ns=[...dec.ships];ns[i]={...s,sp:v};setDec({...dec,ships:ns});})}</td>
          <td style={Sty.td}>{num(s.wo,v=>{const ns=[...dec.ships];ns[i]={...s,wo:v};setDec({...dec,ships:ns});})}</td>
          <td style={Sty.td}>{est?money(est):"—"}</td></tr>);})}
        </tbody></table>
       <p style={{fontFamily:T.mono,fontSize:12,color:T.dim}}>PLANT FG AVAILABLE — {fmt(game.plant.sp)} {NAME.sp} / {fmt(game.plant.wo)} {NAME.wo} (this week's production adds before shipments deduct)</p>
      </div>}

      {tab==="rep"&&<div style={Sty.panel}>
       {game.history.length===0?<p style={{color:T.dim}}>No weeks committed yet. The ledger opens after your first week runs.</p>:(<>
        <h2 style={Sty.h2}>The ledger. <span style={Sty.h2i}>Variance tells the truth.</span></h2>
        <Statement h={last}/>
        <div style={{...Sty.lbl,margin:"18px 0 6px"}}>Weekly trend</div>
        <table style={{borderCollapse:"collapse",width:"100%"}}>
         <thead><tr><th style={Sty.th}>Wk</th><th style={Sty.th}>Revenue</th><th style={Sty.th}>Gross profit</th><th style={Sty.th}>Budget</th><th style={Sty.th}>Expenses</th><th style={Sty.th}>Variance</th><th style={Sty.th}>Share</th><th style={Sty.th}>Sold</th></tr></thead>
         <tbody>{game.history.map(h=>(<tr key={h.week}>
          <td style={Sty.td}>{String(h.week).padStart(2,"0")}</td><td style={Sty.td}>{money(h.revenue)}</td><td style={Sty.td}>{money(h.grossProfit)}</td>
          <td style={Sty.td}>{money(h.budget)}</td><td style={Sty.td}>{money(h.logistics)}</td>
          <td style={{...Sty.td,color:h.variance<0?T.bad:T.good,fontWeight:700}}>{money(h.variance)}</td>
          <td style={Sty.td}>{(h.share*100).toFixed(1)}%</td><td style={Sty.td}>{fmt(h.sold)}</td></tr>))}
         </tbody></table></>)}
      </div>}
      </>)}
      <Footer/>
     </div>);
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
           
    </script>
</body>
</html>
